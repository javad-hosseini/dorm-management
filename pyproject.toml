[project]
name = "dormitory-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "javad", email = "smjh9386hosseini@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.11.1",
    "django==5.2.15",
    "django-jalali==7.4.0",
    "django-jazzmin==3.0.5",
    "gunicorn>=22.0.0",
    "jdatetime==5.3.0",
    "openpyxl==3.1.5",
    "pandas>=2.2.0",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.12",
    "python-decouple==3.8",
    "requests>=2.31.0",
    "sqlparse==0.5.5",
    "tabulate==0.10.0",
    "tzdata==2026.2",
    "whitenoise>=6.6.0",
]

[project.scripts]
dormitory-management = "dormitory_management:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
